# On a vX.Y.Z tag: run every CI check, push ghcr.io/<owner>/oidc-impersonation:X.Y.Z (and X.Y,
# sha-<commit>), then create a GitHub Release for the tag that names the image by digest.
# Actions are pinned by commit SHA (the tag in the comment).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub can't attach a container image to a Release, so the notes name it (tag and digest).
  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the previous release
      # Generated notes list only merged pull requests; commits go straight to main, so list them.
      - run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s (%h)' ${prev:+"$prev.."}"$TAG")
          # The tested versions: the README's Compatibility table, the only source of truth.
          compat=$(awk '/^## Compatibility$/ {on=1; next} on && /^## / {exit} on' README.md)
          test -n "$compat"
          notes=$(printf '## Compatibility\n%s\n\n## Changes\n\n%s\n\n## Image\n\n```\ndocker pull %s:%s\n# digest: %s\n```\n' "$compat" "$changes" "$IMAGE" "${TAG#v}" "$DIGEST")
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" --generate-notes
